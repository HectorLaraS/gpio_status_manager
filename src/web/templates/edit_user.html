<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Edit User</h1>

<p>
    <a href="/users">Back to Users</a>
</p>

<div class="rule-card">

    <form method="POST">

        <p class="small-text">
            Username: {{ user.username }}
        </p>

        <label>Display Name</label>
        <input
            type="text"
            name="display_name"
            value="{{ user.display_name }}"
            required
        >

        <br><br>

        <label>Role</label>
        <select name="role_name">
            <option value="VIEWER" {% if user.role_name == "VIEWER" %}selected{% endif %}>VIEWER</option>
            <option value="ENGINEER" {% if user.role_name == "ENGINEER" %}selected{% endif %}>ENGINEER</option>
            <option value="ADMINISTRATOR" {% if user.role_name == "ADMINISTRATOR" %}selected{% endif %}>ADMINISTRATOR</option>
        </select>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

</div>

</body>
</html>
