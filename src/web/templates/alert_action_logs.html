<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alert Action Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Alert Action Logs</h1>

<p>
    <a href="/">Home</a>
</p>

<table>

    <thead>
        <tr>
            <th>Date</th>
            <th>Action</th>
            <th>Event</th>
            <th>Status</th>
            <th>HTTP</th>
            <th>Details</th>
        </tr>
    </thead>

    <tbody>

    {% for log in logs %}
        <tr>

            <td>{{ log.created_at }}</td>

            <td>{{ log.action_name }}</td>

            <td>{{ log.event_type }}</td>

            <td>{{ log.status }}</td>

            <td>{{ log.response_code }}</td>

            <td>
                <a href="/alert-action-logs/{{ log.id }}">
                    View
                </a>
            </td>

        </tr>
    {% endfor %}

    </tbody>

</table>

</body>
</html>
